<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Link Discord - WayAnime</title>
<style>
:root{color-scheme:dark}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#14121c;font-family:system-ui,sans-serif;color:#eee}
.c{width:min(92vw,420px);background:#1e1b2b;border:1px solid #34304a;border-radius:16px;padding:26px;text-align:center}
h1{margin:0 0 6px;font-size:22px}p{color:#aaa;font-size:14px;line-height:1.5}
button{background:#ff69b4;color:#fff;border:0;border-radius:10px;padding:12px 20px;font-size:15px;font-weight:600;cursor:pointer}
button.s{background:#34304a}
#code{font:700 34px/1.2 ui-monospace,monospace;letter-spacing:6px;margin:16px 0;color:#ffb6dc;user-select:all}
.m{min-height:20px;font-size:13px;color:#aaa;margin-top:10px}
a{color:#ffb6dc}
</style></head><body>
<div class="c">
<h1>Link your Discord</h1>
<p>Get a one-time code, then type <b>/link</b> with that code in the WayAnime Discord server. This lets the bot recognise you, set your nickname and send you a password-reset link in private.</p>
<div id="code"></div>
<button id="go">Get my code</button>
<button id="un" class="s" style="display:none">Unlink</button>
<div class="m" id="m"></div>
<p><a href="/">Back to the site</a></p>
</div>
<script>
var m=document.getElementById('m'),code=document.getElementById('code'),un=document.getElementById('un');
function post(u){return fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}).then(function(r){return r.json().then(function(j){return{ok:r.ok,j:j,s:r.status}})})}
fetch('/api/discord/status').then(function(r){return r.json().then(function(j){return{ok:r.ok,j:j}})}).then(function(x){
  if(!x.ok){m.textContent='Please log in to the site first.';return}
  if(x.j.linked){m.textContent='Your Discord is already linked.';un.style.display=''}
});
document.getElementById('go').onclick=function(){
  post('/api/discord/link-code').then(function(x){
    if(!x.ok){m.textContent=x.s===401?'Please log in to the site first.':'Could not create a code.';return}
    code.textContent=x.j.code;m.textContent='Valid for '+x.j.minutes+' minutes. In Discord: /link code:'+x.j.code;
  });
};
un.onclick=function(){post('/api/discord/unlink').then(function(){m.textContent='Unlinked.';un.style.display='none'})};
</script></body></html>
