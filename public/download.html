.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(10,9,18,.55) 0,rgba(10,9,18,.25) 35%,rgba(10,9,18,.78) 100%),radial-gradient(900px 500px at 50% 100%,rgba(138,77,255,.28),transparent 70%)}
.brand{font-weight:800;font-size:clamp(34px,6vw,58px);letter-spacing:.5px;margin:0;text-align:center;text-shadow:0 4px 30px rgba(0,0,0,.45)}
.brand b{background:linear-gradient(90deg,var(--a1),var(--a2) 55%,var(--vio));-webkit-background-clip:text;background-clip:text;color:transparent}

.logo{display:block;width:clamp(120px,22vw,190px);height:auto;margin:0 auto;filter:drop-shadow(0 10px 30px rgba(138,77,255,.55));animation:float 5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media(prefers-reduced-motion:reduce){.logo{animation:none}}
.tag{margin:18px 0 40px;color:var(--mu);text-align:center;font-size:clamp(15px,2.2vw,18px);text-shadow:0 2px 14px rgba(0,0,0,.5)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,340px));gap:20px;width:100%;justify-content:center}
.card{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:28px 26px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);box-shadow:0 20px 50px rgba(0,0,0,.35);transition:transform .25s ease,border-color .25s ease}
.card:hover{transform:translateY(-4px);border-color:rgba(255,255,255,.3)}
.ico{display:block;width:84px;height:84px;border-radius:22px;object-fit:cover;margin-bottom:14px;border:1px solid var(--line);box-shadow:0 10px 28px rgba(0,0,0,.45),0 0 0 4px rgba(255,255,255,.06)}
.card h2{margin:0;font-size:22px;font-weight:800}
.card p{margin:0 0 18px;color:var(--mu);font-size:14px}
.btn{margin-top:auto;display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px 18px;border-radius:14px;border:0;font:700 15px inherit;font-family:inherit;color:#fff;background:linear-gradient(90deg,var(--a1),var(--a2));cursor:pointer;transition:filter .2s,transform .2s}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:scale(.98)}
.btn svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.btn[aria-disabled="true"]{background:rgba(255,255,255,.12);color:var(--mu);cursor:not-allowed;filter:none}
.btn[aria-disabled="true"] svg{stroke:var(--mu)}
.prog{width:100%;margin-top:12px;display:none}
.prog.on{display:block}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--a1),var(--a2),var(--vio));transition:width .2s linear}
.bar.ind i{width:40%;animation:ind 1.1s ease-in-out infinite alternate}
@keyframes ind{from{margin-left:0}to{margin-left:60%}}
.pt{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:12.5px;color:var(--mu)}
@media(prefers-reduced-motion:reduce){.bar.ind i{animation:none;width:100%}}
.note{margin-top:34px;color:var(--mu);font-size:13px;text-align:center;opacity:.85;text-shadow:0 2px 10px rgba(0,0,0,.5)}
:focus-visible{outline:2px solid var(--a1);outline-offset:3px}
@media(max-width:700px){.grid{grid-template-columns:minmax(0,420px)}.hero{padding:40px 16px}}
.hero{justify-content:flex-start;padding:0 20px 48px}
.top{width:100%;max-width:1080px;display:flex;align-items:center;justify-content:space-between;padding:18px 0}
.tb{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px}
.tb img{height:22px;width:auto;filter:drop-shadow(0 4px 12px rgba(138,77,255,.6))}
.tl{padding:9px 16px;border-radius:99px;border:1px solid var(--line);background:rgba(18,17,29,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:13.5px;font-weight:700;transition:background .2s}
.tl:hover{background:rgba(255,255,255,.14)}
.wrap{width:100%;max-width:1080px;display:flex;flex-direction:column;align-items:center;padding-top:clamp(28px,8vh,90px)}
.hl{margin:0;text-align:center;font-weight:800;font-size:clamp(36px,7vw,72px);line-height:1.05;letter-spacing:-1px;text-shadow:0 4px 30px rgba(0,0,0,.45)}
.hl b{background:linear-gradient(90deg,var(--a1),var(--a2) 55%,var(--vio));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.tag{max-width:560px;margin:18px 0 18px}
.chips{list-style:none;margin:0 0 36px;padding:0;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chips li{padding:7px 14px;border-radius:99px;font-size:13px;font-weight:700;background:rgba(255,255,255,.12);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.how{width:100%;margin-top:56px}
.how h2{margin:0 0 18px;text-align:center;font-size:22px;font-weight:800;text-shadow:0 2px 14px rgba(0,0,0,.5)}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.col{background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:22px 24px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.col h3{margin:0 0 12px;font-size:17px;font-weight:800}
.col ol{margin:0;padding:0;list-style:none;counter-increment:s}
.col li{counter-increment:s;position:relative;padding:0 0 12px 38px;color:var(--mu);font-size:14px}
.col li:last-child{padding-bottom:0}
.col li::before{content:counter(s);position:absolute;left:0;top:-1px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--a1),var(--a2))}
.col li b{color:var(--tx)}
.foot{margin-top:44px;color:var(--mu);font-size:13px;text-align:center;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.foot a{text-decoration:underline}
.grid{max-width:720px;grid-template-columns:repeat(2,minmax(0,1fr))}
.card{padding:30px 26px}
@media(max-width:700px){.cols{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.hero{padding:0 16px 40px}}
.hero{min-height:100vh;min-height:100dvh;justify-content:flex-start;padding:0 18px 18px}
.wrap{flex:1;justify-content:center;padding-top:0;max-width:760px}
.logo{width:clamp(84px,14vh,120px);margin:0 auto 6px}
.hl{font-size:clamp(30px,5.2vw,52px);margin:6px 0 0}
.tag{margin:12px 0 26px;font-size:clamp(14px,2vw,17px)}
.pills{display:flex;gap:14px;width:100%;justify-content:center;align-items:flex-start}
.item{flex:1 1 0;max-width:320px;min-width:0}
.pill{display:flex;align-items:center;gap:12px;width:100%;padding:8px 20px 8px 8px;border-radius:99px;font-weight:700;font-size:16px;color:#fff;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);box-shadow:0 12px 34px rgba(0,0,0,.35);transition:transform .2s,border-color .2s,background .2s}
.pill:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.35);background:rgba(40,30,70,.6)}
.pill:active{transform:scale(.98)}
.pill img{width:44px;height:44px;object-fit:contain;flex:none;padding:7px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
.pill span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill svg{width:20px;height:20px;flex:none;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.foot{margin:0;padding-top:10px}
@media(max-width:600px){.pills{flex-direction:column;align-items:center;gap:12px}.item{width:100%;max-width:340px;flex:none}}
@media(max-height:560px){.logo{width:64px}.tag{margin:8px 0 14px}}
.pill{position:relative;overflow:hidden;isolation:isolate;cursor:pointer}
.pill::before{content:"";position:absolute;inset:0;z-index:-1;width:var(--p,0%);background:linear-gradient(90deg,var(--a1),var(--a2) 60%,var(--vio));transition:width .25s linear}
.pill.ind::before{width:40%;animation:ind 1.1s ease-in-out infinite alternate}
.pill.busy{cursor:progress}
.pill.busy svg{display:none}
.pcx{display:none;font-style:normal;font-weight:800;font-variant-numeric:tabular-nums;font-size:15px;flex:none}
.pill.busy .pcx{display:block}
@media(prefers-reduced-motion:reduce){.pill.ind::before{animation:none;width:100%;opacity:.6}}
@media(prefers-reduced-motion:reduce){.card,.btn,.pill{transition:none}}
</style></head>
