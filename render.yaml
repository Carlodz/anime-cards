services:
  - type: web
    name: anime-cards
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: BASE_URL
        sync: false
      - key: BOT_API_KEY
        sync: false
      - key: BOT_ACCOUNT_PASSWORD
        sync: false
      - key: STEAM_API_KEY
        sync: false
      - key: A4U_HOSTS
        value: "https://anime4up.bond/,https://aniime4up.com/,https://aniime4up.org/,https://anime4up.cam/,https://anime4up.pro/,https://anime4up.rest/"
      - key: AUTO_EPS
        value: "on"
