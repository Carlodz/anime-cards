<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WAYANIME</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ff6b9d'/%3E%3Ctext x='32' y='44' font-size='34' font-weight='800' text-anchor='middle' fill='%23fff' font-family='Arial'%3EW%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;600;800&display=swap">
<style>
:root{--ink:#0f0b17;--panel:#1a1426;--panel2:#221a33;--line:#2f2545;--text:#f4eefb;--mute:#9a8db3;--pink:#ff6b9d;--iron:#8d949e;--silver:#dfe5ee;--gold:#f4b82e;--diamond:#4fd6ff;--legendary:#b66cff}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font:500 15px/1.5 Manrope,system-ui,sans-serif;min-width:1100px}
h1,h2,h3,.disp{font-family:Unbounded,Manrope,sans-serif;font-weight:700;letter-spacing:-.01em}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.hide{display:none!important}
#pc{display:none;position:fixed;inset:0;z-index:99;background:var(--ink);align-items:center;justify-content:center;text-align:center;padding:40px}
#pc div{max-width:360px}#pc h2{font-size:22px;margin-bottom:10px}
@media (max-width:1099px){#pc{display:flex}}

/* auth */
#auth{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh}
#auth .art{background:linear-gradient(180deg,rgba(15,11,23,0) 40%,var(--ink)),url(/kushina.jpg) center 20%/cover;display:flex;align-items:flex-end;padding:56px}
#auth .art h1{font-size:54px;line-height:1.02;max-width:520px}
#auth .art p{color:var(--mute);margin-top:14px;max-width:420px}
#auth .box{display:flex;flex-direction:column;justify-content:center;padding:0 12%}
.tabs{display:flex;gap:4px;background:var(--panel);border-radius:12px;padding:4px;margin-bottom:28px;width:max-content}
.tabs button{border:0;background:none;padding:8px 22px;border-radius:9px;color:var(--mute);font-weight:800}
.tabs button.on{background:var(--pink);color:#fff}
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.f label{color:var(--mute);font-size:13px;font-weight:600}
.f input{background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:13px 14px}
.f input:focus{border-color:var(--pink);outline:0}
.btn{background:var(--pink);color:#fff;border:0;border-radius:10px;padding:13px 22px;font-weight:800}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--panel2);color:var(--text)}
.btn.sm{padding:7px 14px;font-size:13px}
.err{color:#ff8aa6;min-height:22px;margin-bottom:8px;font-size:14px}
.dc{margin-top:14px;text-align:center;color:var(--mute)}.dc a{color:var(--pink)}

/* app */
#app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
aside{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);padding:28px 18px;display:flex;flex-direction:column;gap:6px;background:#120d1c}
aside .brand{font-family:Unbounded;font-size:19px;font-weight:700;padding:0 12px 24px}
aside .brand b{color:var(--pink)}
aside button.nv{display:flex;justify-content:space-between;align-items:center;border:0;background:none;text-align:left;padding:12px 14px;border-radius:10px;color:var(--mute);font-weight:800}
aside button.nv:hover{background:var(--panel)}
aside button.nv.on{background:var(--panel2);color:var(--text);box-shadow:inset 3px 0 var(--pink)}
aside .me{margin-top:auto;padding:14px;border-radius:12px;background:var(--panel);display:flex;flex-direction:column;gap:8px}
aside .me span{font-weight:800;word-break:break-all}
main{padding:44px 56px 80px;max-width:1500px;width:100%}
main h2{font-size:28px;margin-bottom:6px}
.sub{color:var(--mute);margin-bottom:32px;max-width:640px}

/* packs */
.shelf{display:grid;grid-template-columns:repeat(3,minmax(240px,300px));gap:36px;align-items:end}
.pk{position:relative;aspect-ratio:2/3;border:0;border-radius:16px;overflow:hidden;color:#fff;text-align:left;padding:22px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;transition:transform .25s;box-shadow:0 24px 50px -20px #000}
.pk::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.14) 0 10px,transparent 10px 28px)}
.pk::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 30%,rgba(255,255,255,.3) 50%,transparent 70%);transform:translateX(-120%);transition:transform .7s}
.pk:not(:disabled):hover{transform:translateY(-8px) rotate(-1deg)}
.pk:not(:disabled):hover::after{transform:translateX(120%)}
.pk:disabled{filter:grayscale(.9) brightness(.55);cursor:default}
.pk b,.pk span,.pk i{position:relative;z-index:1}
.pk b{font:700 28px/1.05 Unbounded;text-shadow:2px 2px 0 rgba(0,0,0,.35)}
.pk span{font-size:13px;opacity:.9}
.pk i{font-style:normal;font-weight:800;margin-top:10px;background:rgba(15,11,23,.75);border-radius:8px;padding:6px 12px;width:max-content}
.pk.d{background:linear-gradient(160deg,#ff5a2a,#ff8a1f 50%,#ffc22e)}
.pk.c{background:linear-gradient(160deg,#ff4fa3,#ff7eb6 50%,#ffc2e0)}
.pk.l{background:linear-gradient(160deg,#2a0f4d,#7c3aed 55%,#ffb800)}
.streak{display:flex;gap:8px;margin-top:34px;align-items:center;color:var(--mute)}
.streak i{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:800}
.streak i.on{background:var(--pink);border-color:var(--pink);color:#fff}
.streak i:last-of-type{border-color:var(--gold)}
.streak i:last-of-type.on{background:var(--gold);color:#1a1426}

/* collection */
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
.chip{border:1.5px solid var(--line);background:none;border-radius:999px;padding:7px 16px;font-weight:800;color:var(--mute)}
.chip.on{background:var(--pink);border-color:var(--pink);color:#fff}
.prog{display:flex;align-items:center;gap:14px;margin-bottom:26px;color:var(--mute)}
.prog div{flex:1;max-width:360px;height:8px;border-radius:8px;background:var(--panel2);overflow:hidden}
.prog div i{display:block;height:100%;background:var(--pink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:22px}
.cd{background:none;border:0;text-align:left;padding:0}
.cd .im{aspect-ratio:2/3;border-radius:12px;overflow:hidden;border:3px solid var(--rc,var(--line));background:var(--panel);position:relative;transition:transform .2s}
.cd:hover .im{transform:translateY(-4px)}
.cd img{width:100%;height:100%;object-fit:cover;display:block}
.cd.no img{filter:grayscale(1) brightness(.18)}
.cd.no .im{border-color:var(--line)}
.cd.no .im::after{content:"?";position:absolute;inset:0;display:grid;place-items:center;font:700 44px Unbounded;color:var(--line)}
.cd p{margin-top:8px;font-weight:800}
.pips{display:flex;gap:6px;margin-top:4px;min-height:18px}
.pips u{text-decoration:none;font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;background:var(--panel2);color:var(--mute);opacity:.45}
.pips u.on{opacity:1;color:#15101f;background:var(--c)}

/* gifts */
.row{display:flex;gap:12px;max-width:520px}
.row input{flex:1;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:13px 14px;text-transform:uppercase;letter-spacing:.14em;font-weight:800}
.row input:focus{border-color:var(--pink);outline:0}
.list{margin-top:34px;max-width:620px;display:flex;flex-direction:column;gap:10px}
.li{display:flex;align-items:center;gap:14px;background:var(--panel);border-radius:12px;padding:10px 14px}
.li img{width:42px;height:62px;object-fit:cover;border-radius:6px}
.li .t{flex:1}.li .t b{display:block}.li .t small{color:var(--mute)}
.li code{font:800 15px Manrope;letter-spacing:.14em;color:var(--pink)}
.empty{color:var(--mute);padding:26px;border:1.5px dashed var(--line);border-radius:12px}

/* modal */
#mod{position:fixed;inset:0;z-index:50;background:rgba(10,7,16,.86);display:none;align-items:center;justify-content:center}
#mod.on{display:flex}
.rv{text-align:center;display:flex;flex-direction:column;align-items:center;gap:22px}
.flip{width:300px;aspect-ratio:2/3;position:relative;perspective:1200px}
.flip>div{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;transition:transform .9s cubic-bezier(.2,.8,.2,1);overflow:hidden}
.flip .bk{display:grid;place-items:center;font:700 80px Unbounded;color:rgba(255,255,255,.55);box-shadow:0 30px 70px -20px #000}
.flip .fr{transform:rotateY(180deg);border:4px solid var(--rc);box-shadow:0 0 60px -6px var(--rc)}
.flip.on .bk{transform:rotateY(180deg)}.flip.on .fr{transform:rotateY(360deg)}
.fr img{width:100%;height:100%;object-fit:cover}
.fr .lb{position:absolute;left:0;right:0;bottom:0;padding:34px 16px 14px;background:linear-gradient(transparent,rgba(0,0,0,.85));text-align:left;font:700 20px Unbounded}
.fr .lb small{display:block;font:600 13px Manrope;color:var(--rc)}
.dt{display:grid;grid-template-columns:320px 380px;gap:44px;background:var(--panel);padding:32px;border-radius:20px;max-height:92vh}
.dt .big{aspect-ratio:2/3;border-radius:14px;overflow:hidden;border:4px solid var(--rc)}
.dt .big img{width:100%;height:100%;object-fit:cover}
.dt h3{font-size:24px}.dt .by{color:var(--mute);margin:4px 0 22px}
.dt .own{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.dt .own b{color:var(--c)}
.code{font:800 26px Unbounded;letter-spacing:.14em;color:var(--pink);margin:12px 0}
#toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:12px 20px;border-radius:12px;font-weight:800;z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* WAYANIME polish: responsive layouts, depth, and cinematic card motion */
html{scroll-behavior:smooth}
body{min-width:0;overflow-x:hidden;background-image:radial-gradient(ellipse at 78% 4%,rgba(255,107,157,.09),transparent 35%),radial-gradient(ellipse at 10% 85%,rgba(79,214,255,.06),transparent 32%)}
#pc{display:none!important}
#auth{position:relative;isolation:isolate;grid-template-columns:minmax(0,1.08fr) minmax(360px,.92fr);overflow:hidden}
#auth:before{content:"";position:absolute;z-index:-1;width:520px;height:520px;border-radius:50%;right:-180px;top:-220px;background:radial-gradient(circle,rgba(255,107,157,.16),transparent 68%);animation:ambient 9s ease-in-out infinite alternate}
#auth .art{position:relative;min-height:100vh;overflow:hidden;background-position:center 20%;animation:artReveal .9s ease both}
#auth .art:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(120deg,transparent 15%,rgba(255,255,255,.06) 48%,transparent 70%);transform:translateX(-100%);animation:artShine 8s ease-in-out infinite}
#auth .art>div{position:relative;z-index:1;animation:rise .75s .15s both}
#auth .art h1{font-size:clamp(34px,4.1vw,62px);text-wrap:balance;text-shadow:0 8px 38px #09060f}
#auth .art p{color:#d4c9e4;line-height:1.8}
#auth .box{width:100%;max-width:540px;margin:auto;padding:56px clamp(24px,5vw,76px);animation:rise .7s .1s both}
#auth .box:before{content:"WAYANIME";font:700 13px Unbounded,sans-serif;letter-spacing:.22em;color:var(--pink);margin-bottom:22px}
.tabs{width:100%;display:grid;grid-template-columns:1fr 1fr;border:1px solid rgba(255,255,255,.04)}
.tabs button{transition:background .22s,color .22s,transform .22s}
.tabs button:active,.btn:active{transform:scale(.98)}
.f input{width:100%;transition:border-color .2s,box-shadow .2s,background .2s}
.f input:focus{box-shadow:0 0 0 4px rgba(255,107,157,.12);background:#20172e}
#go{width:100%;box-shadow:0 9px 26px rgba(255,107,157,.17);transition:transform .2s,filter .2s,box-shadow .2s}
#go:hover{box-shadow:0 12px 34px rgba(255,107,157,.3);transform:translateY(-2px)}
.dc a{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px;padding:12px 16px;border:1px solid #3d3153;border-radius:10px;background:#211a30;color:#fff;text-decoration:none;font-weight:800;transition:transform .2s,border-color .2s,background .2s}
.dc a:before{content:"";width:19px;height:19px;display:inline-block;background:#5865f2;mask: none;border-radius:6px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.dc a:hover{border-color:#6875ff;background:#2a2240;transform:translateY(-1px)}
#app{grid-template-columns:248px minmax(0,1fr)}
aside{z-index:5;backdrop-filter:blur(16px);background:rgba(18,13,28,.94)}
main{min-width:0;padding:clamp(24px,4vw,56px) clamp(18px,4vw,56px) 80px;animation:rise .35s ease both}
main h2{line-height:1.25}
.shelf{grid-template-columns:repeat(3,minmax(0,300px));gap:clamp(14px,2.4vw,36px)}
.pk{transform-style:preserve-3d;will-change:transform;box-shadow:0 24px 60px -22px #000,0 0 0 1px rgba(255,255,255,.04) inset}
.pk:focus-visible{outline:3px solid var(--pink);outline-offset:4px}
.pk:not(:disabled):hover{transform:translateY(-10px) rotateX(2deg) rotateY(-2deg) scale(1.015)}
.pk:before{animation:packGleam 7s linear infinite;pointer-events:none}
.pk:after{pointer-events:none}
#mod{padding:20px;overflow:auto;overscroll-behavior:contain}
#mod.on{display:flex;align-items:center;justify-content:center}
.rv{animation:rise .35s ease both;max-height:calc(100dvh - 40px);overflow:auto;padding:12px 8px}
.rv h3{margin-bottom:18px;text-shadow:0 4px 24px var(--rc)}
.flip{filter:drop-shadow(0 18px 35px rgba(0,0,0,.42));transform:translateZ(0)}
.flip .fr{box-shadow:0 0 0 1px rgba(255,255,255,.25) inset,0 0 60px -6px var(--rc)}
.flip .fr:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 25%,rgba(255,255,255,.36) 48%,transparent 62%);transform:translateX(-120%);opacity:0}
.flip.on .fr:after{opacity:1;animation:cardShine 1.1s .65s ease-out}
.flip.on{animation:cardLand .6s 1s both}
.dt{width:min(100%,800px);grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:clamp(18px,4vw,44px);overflow:auto;animation:rise .3s ease both}
.cd{transition:transform .22s,border-color .22s,filter .22s;animation:cardAppear .38s both}
.cd:hover{transform:translateY(-5px) scale(1.015);filter:brightness(1.07)}
.cd .im img{transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.cd:hover .im img{transform:scale(1.055)}
#toast{max-width:calc(100vw - 28px);text-align:center;backdrop-filter:blur(12px)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes artReveal{from{opacity:.35;transform:scale(1.025)}to{opacity:1;transform:scale(1)}}
@keyframes ambient{from{transform:translate(0,0) scale(.9);opacity:.65}to{transform:translate(-60px,55px) scale(1.12);opacity:1}}
@keyframes artShine{0%,55%{transform:translateX(-100%)}75%,100%{transform:translateX(100%)}}
@keyframes packGleam{0%,70%,100%{opacity:.75}35%{opacity:1}}
@keyframes cardShine{from{transform:translateX(-120%)}to{transform:translateX(120%)}}
@keyframes cardLand{0%{transform:scale(1.025)}60%{transform:scale(.99)}100%{transform:scale(1)}}
@keyframes cardAppear{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(max-width:900px){
 #auth{grid-template-columns:minmax(0,1fr) minmax(330px,.9fr)}
 #auth .art{padding:34px}
 #auth .art h1{font-size:clamp(32px,5vw,48px)}
 #app{grid-template-columns:205px minmax(0,1fr)}
 aside{padding:24px 12px}
 .shelf{grid-template-columns:repeat(2,minmax(0,1fr));max-width:650px}
 .shelf .pk:last-child{grid-column:1/-1;max-width:300px}
 .dt{grid-template-columns:minmax(0,260px) minmax(0,1fr)}
}
@media(max-width:640px){
 #auth{display:flex;flex-direction:column;min-height:100svh}
 #auth .art{min-height:240px;height:32svh;max-height:340px;padding:26px 22px;background-position:center 24%}
 #auth .art h1{font-size:clamp(30px,8vw,44px);max-width:440px}
 #auth .art p{font-size:13px;max-width:390px;margin-top:8px}
 #auth .box{padding:30px 22px 38px;max-width:480px}
 #auth .box:before{margin-bottom:16px}
 .tabs{margin-bottom:22px}
 #app{display:flex;flex-direction:column;min-height:100svh}
 aside{position:sticky;top:0;height:auto;min-height:0;padding:12px 14px 10px;border-right:0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto auto auto;align-items:center;gap:5px}
 aside .brand{font-size:15px;padding:0 8px 0 0;white-space:nowrap}
 aside button.nv{padding:9px 10px;font-size:12px;justify-content:center}
 aside button.nv.on{box-shadow:inset 0 -2px var(--pink)}
 aside .me{grid-column:1/-1;margin-top:5px;padding:8px 10px;display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:8px}
 aside .me span{font-size:12px;max-width:70%;overflow-wrap:anywhere}
 main{padding:26px 16px 56px}
 main h2{font-size:23px}
 .sub{font-size:13px;margin-bottom:22px}
 .shelf{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:stretch}
 .pk{padding:13px;border-radius:12px;min-width:0}
 .pk b{font-size:clamp(16px,4vw,23px)}
 .pk span{font-size:11px}
 .pk i{font-size:11px}
 .shelf .pk:last-child{grid-column:auto;max-width:none}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px!important}
 .bar{gap:7px;overflow-x:auto;padding-bottom:8px}
 .chip{white-space:nowrap}
 #mod{padding:12px}
 .rv{width:100%;padding:12px 0}
 .rv h3{font-size:18px}
 .flip{width:min(78vw,300px)}
 .dt{grid-template-columns:minmax(0,1fr);gap:18px;padding:18px;width:100%;max-height:calc(100dvh - 24px)}
 .dt .big{width:min(100%,260px);margin:0 auto}
 .dt h3{font-size:20px}
 .row{flex-wrap:wrap}
 .row input{min-width:0;flex:1}
 .li{gap:8px;flex-wrap:wrap}
 .li img{width:48px;height:68px;object-fit:cover}
 .li code{font-size:12px}
 .code{font-size:22px;letter-spacing:.08em;overflow-wrap:anywhere}
 #toast{bottom:14px;font-size:13px}
}
@media(max-width:380px){
 aside{grid-template-columns:1fr auto auto;}
 aside .brand{grid-column:1/-1;padding-bottom:4px}
 aside button.nv{font-size:11px;padding:8px 7px}
 .shelf{gap:8px}
 .pk{padding:10px}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}

</style>

<body>
<div id="pc"><div><h2>WAYANIME is built for PC</h2><p style="color:var(--mute)">Open this page on a computer with a wider screen to open packs and manage your collection.</p></div></div>

<section id="auth" class="hide">
  <div class="art"><div><h1>Open a pack every day.</h1><p>Collect anime cards, climb from Iron to Diamond, and trade duplicates with gift codes.</p></div></div>
  <div class="box">
    <div class="tabs"><button id="tl" class="on">Log in</button><button id="tr">Create account</button></div>
    <div class="f"><label for="u">Username</label><input id="u" maxlength="21" autocomplete="username"></div>
    <div class="f"><label for="p">Password</label><input id="p" type="password" maxlength="72" autocomplete="current-password"></div>
    <div class="f hide" id="cf"><label for="cp">Confirm password</label><input id="cp" type="password" maxlength="72" autocomplete="new-password"></div>
    <div class="err" id="err"></div>
    <button class="btn" id="go" type="button">Log in</button>
    <div class="dc hide" id="dc"><a href="/auth/login">Continue with Discord</a></div>
  </div>
</section>

<div id="app" class="hide">
  <aside>
    <div class="brand">WAY<b>ANIME</b></div>
    <button class="nv on" data-v="packs">Packs</button>
    <button class="nv" data-v="coll">Collection <small id="cnt"></small></button>
    <button class="nv" data-v="gifts">Gifts</button>
    <div class="me"><span id="me"></span><button class="btn ghost sm" id="out">Log out</button></div>
  </aside>
  <main id="main"></main>
</div>

<div id="mod"></div>
<div id="toast" role="status"></div>

<script>
var $=function(s){return document.querySelector(s)};
var C=[],ST=null,view='packs',flt='all',mode='login';
var R=[['iron','Iron'],['silver','Silver'],['gold','Gold'],['diamond','Diamond']];
var RC={iron:'#8d949e',silver:'#dfe5ee',gold:'#f4b82e',diamond:'#4fd6ff',legendary:'#b66cff'};
var ERR={invalid:'Wrong username or password.','too many':'Too many attempts. Wait a few minutes and try again.','bad username':'Usernames use 3 to 20 letters, numbers, dots, dashes or underscores.','bad password':'Passwords need 6 to 72 characters.',mismatch:'The two passwords do not match.',taken:'That username is taken. Pick another one.',full:'Sign-ups are closed right now.'};
function api(m,u,b){return fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined}).then(function(r){return r.json().catch(function(){return{}}).then(function(d){return{ok:r.ok,s:r.status,d:d}})})}
var fmt=new Intl.DateTimeFormat('en-US',{timeZone:'Africa/Algiers',year:'numeric',month:'numeric',day:'numeric'});
function ds(o){var m={};fmt.formatToParts(new Date(Date.now()+o*864e5)).forEach(function(x){m[x.type]=x.value});return m.year+'-'+m.month+'-'+m.day}
function wk(){var p=ds(0).split('-').map(Number),t=Date.UTC(p[0],p[1]-1,p[2]),dw=new Date(t).getUTCDay(),q=new Date(t-((dw+6)%7)*864e5);return q.getUTCFullYear()+'-'+(q.getUTCMonth()+1)+'-'+q.getUTCDate()}
function A(id){return C.filter(function(x){return x.id===id})[0]}
function own(a,i,r){return ((((ST.a[a]||{}).got||{})[i]||{})[r])||0}
function rars(a){return a==='leg'?[['legendary','Legendary']]:R}
function toast(t){var e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove('on')},2600)}
function show(){$('#mod').classList.add('on')}
function hide(){$('#mod').classList.remove('on');$('#mod').innerHTML=''}
$('#mod').onclick=function(e){if(e.target===this)hide()};
document.addEventListener('keydown',function(e){if(e.key==='Escape')hide()});

/* auth */
function setMode(m){mode=m;$('#tl').classList.toggle('on',m==='login');$('#tr').classList.toggle('on',m==='reg');$('#cf').classList.toggle('hide',m==='login');$('#go').textContent=m==='login'?'Log in':'Create account';$('#err').textContent=''}
$('#tl').onclick=function(){setMode('login')};$('#tr').onclick=function(){setMode('reg')};
function submit(){
  var b={username:$('#u').value.trim(),password:$('#p').value};
  if(mode==='reg')b.confirm=$('#cp').value;
  api('POST',mode==='login'?'/auth/loginpw':'/auth/register',b).then(function(r){
    if(r.ok)boot();else $('#err').textContent=ERR[r.d.error]||'Something went wrong. Try again.';
  });
}
$('#go').onclick=submit;
['u','p','cp'].forEach(function(i){$('#'+i).addEventListener('keydown',function(e){if(e.key==='Enter')submit()})});
$('#out').onclick=function(){location.href='/auth/logout'};

/* boot */
function boot(){
  api('GET','/api/me').then(function(r){
    if(!r.ok){
      $('#app').classList.add('hide');$('#auth').classList.remove('hide');
      api('GET','/api/config').then(function(c){if(c.d&&c.d.discord)$('#dc').classList.remove('hide')});
      return;
    }
    $('#me').textContent=r.d.user.username;
    Promise.all([fetch('/cards.json').then(function(x){return x.json()}),api('GET','/api/state')]).then(function(a){
      C=a[0];ST=(a[1].d.state)||{a:{},cur:0};if(!ST.a)ST.a={};
      $('#auth').classList.add('hide');$('#app').classList.remove('hide');render();
    });
  });
}
document.querySelectorAll('.nv').forEach(function(b){b.onclick=function(){view=b.dataset.v;render()}});

/* render */
function render(){
  document.querySelectorAll('.nv').forEach(function(b){b.classList.toggle('on',b.dataset.v===view)});
  var n=0;C.forEach(function(a){var g=(ST.a[a.id]||{}).got||{};Object.keys(g).forEach(function(i){var o=g[i];Object.keys(o).forEach(function(r){if(o[r]>0)n++})})});
  $('#cnt').textContent=n?n:'';
  if(view==='packs')packs();else if(view==='coll')coll();else gifts();
}
function packs(){
  var d=ST.d||{last:'',streak:0},today=ds(0),canD=d.last!==today;
  var e=(d.last===today||d.last===ds(-1))?d.streak||0:0,w=wk();
  var canC=((ST.a.cute||{}).last)!==w,canL=((ST.a.leg||{}).last)!==w;
  var s='';for(var i=1;i<=7;i++)s+='<i class="'+(i<=e?'on':'')+'">'+i+'</i>';
  $('#main').innerHTML='<h2>Packs</h2><p class="sub">One pack a day. Luck picks the anime, the character and the rarity. Open seven days in a row and day seven is guaranteed Gold or Diamond.</p>'+
  '<div class="shelf">'+
  tile('d','Daily pack',e===6&&canD?'Day 7: Gold or Diamond guaranteed':'Any anime, any rarity',canD,'d')+
  tile('c','Cute pack','One card every week',canC,'c')+
  tile('l','Legendary vault','One try every week. The vault can be empty.',canL,'l')+
  '</div><div class="streak"><span>Login streak</span>'+s+'</div>';
  document.querySelectorAll('.pk').forEach(function(b){b.onclick=function(){openPack(b.dataset.k)}});
}
function tile(k,t,sub,ok,c){return '<button class="pk '+c+'" data-k="'+k+'"'+(ok?'':' disabled')+'><b>'+t+'</b><span>'+sub+'</span><i>'+(ok?'Open pack':'Opened')+'</i></button>'}
function openPack(k){
  var u={d:'/api/open',c:'/api/cute',l:'/api/legendary'}[k];
  api('POST',u).then(function(r){
    if(r.d&&r.d.state)ST=r.d.state;
    if(r.s===409){toast('You already opened this pack.');render();return}
    if(!r.ok){toast('Could not open the pack. Log in again.');return}
    var c=r.d.card;
    if(!c){toast('The vault was empty this time. Try again next week.');render();return}
    if(k==='l')c={a:'leg',i:c.i,r:'legendary'};
    reveal(c,r.d.card.boost?'Day 7 bonus':'You got');render();
  });
}
function reveal(c,t){
  var a=A(c.a);
  $('#mod').innerHTML='<div class="rv" style="--rc:'+RC[c.r]+'"><h3>'+t+'</h3><div class="flip" id="fl"><div class="bk" style="background:linear-gradient(160deg,'+a.g.join(',')+')">?</div><div class="fr"><img src="'+a.i[c.i]+'" alt=""><div class="lb">'+a.c[c.i]+'<small>'+a.n+', '+c.r+'</small></div></div></div><button class="btn" id="cl">Add to collection</button></div>';
  show();setTimeout(function(){var f=$('#fl');if(f)f.classList.add('on')},650);$('#cl').onclick=hide;
}

/* collection */
function best(a,i){var rs=rars(a),b=-1;rs.forEach(function(r,j){if(own(a,i,r[0])>0)b=j});return b<0?null:rs[b][0]}
function coll(){
  var chips='<button class="chip'+(flt==='all'?' on':'')+'" data-f="all">All</button>';
  C.forEach(function(a){chips+='<button class="chip'+(flt===a.id?' on':'')+'" data-f="'+a.id+'">'+a.n+'</button>'});
  var tot=0,got=0,g='';
  C.forEach(function(a){
    var rs=rars(a.id);
    a.i.forEach(function(img,i){
      var b=best(a.id,i);tot++;if(b)got++;
      if(flt!=='all'&&flt!==a.id)return;
      var pips='';rs.forEach(function(r){var c=own(a.id,i,r[0]);pips+='<u class="'+(c?'on':'')+'" style="--c:'+RC[r[0]]+'" title="'+r[1]+'">'+(c>1?c:r[1][0])+'</u>'});
      g+='<button class="cd'+(b?'':' no')+'" data-a="'+a.id+'" data-i="'+i+'"'+(b?' style="--rc:'+RC[b]+'"':'')+'><div class="im"><img src="'+img+'" alt="" loading="lazy"></div><p>'+(b?(a.c[i]||'Card'):'Not found yet')+'</p><div class="pips">'+pips+'</div></button>';
    });
  });
  $('#main').innerHTML='<h2>Collection</h2><p class="sub">Select a card you own to see every rarity you hold and send a duplicate as a gift.</p><div class="bar">'+chips+'</div><div class="prog"><span>'+got+' of '+tot+' characters found</span><div><i style="width:'+Math.round(got/tot*100)+'%"></i></div></div><div class="grid">'+g+'</div>';
  document.querySelectorAll('.chip').forEach(function(b){b.onclick=function(){flt=b.dataset.f;coll()}});
  document.querySelectorAll('.cd').forEach(function(b){b.onclick=function(){if(!b.classList.contains('no'))detail(b.dataset.a,+b.dataset.i)}});
}
function detail(a,i){
  var an=A(a),b=best(a,i),rows='';
  rars(a).forEach(function(r){var c=own(a,i,r[0]);rows+='<div class="own" style="--c:'+RC[r[0]]+'"><span><b>'+r[1]+'</b> x'+c+'</span>'+(c>0?'<button class="btn sm ghost" data-r="'+r[0]+'">Gift one</button>':'<small style="color:var(--mute)">Not owned</small>')+'</div>'});
  $('#mod').innerHTML='<div class="dt" style="--rc:'+RC[b]+'"><div class="big"><img src="'+an.i[i]+'" alt=""></div><div><h3>'+an.c[i]+'</h3><p class="by">'+an.n+'</p>'+rows+'<div id="gr"></div><button class="btn ghost" id="cl" style="margin-top:22px">Close</button></div></div>';
  show();$('#cl').onclick=hide;
  document.querySelectorAll('.own button').forEach(function(x){x.onclick=function(){
    api('POST','/api/gift',{a:a,i:i,r:x.dataset.r}).then(function(r){
      if(!r.ok){toast(r.d.error==='too many pending codes'?'You have 20 open gift codes. Cancel one first.':'Could not create the gift code.');return}
      ST=r.d.state;render();
      $('#gr').innerHTML='<p class="sub" style="margin:18px 0 0">Send this code to a friend. The card leaves your collection until they redeem it.</p><div class="code">'+r.d.code+'</div><button class="btn sm" id="cp2">Copy code</button>';
      $('#cp2').onclick=function(){navigator.clipboard.writeText(r.d.code).then(function(){toast('Code copied.')})};
      var pa=$('.own button[data-r="'+x.dataset.r+'"]');if(pa)pa.parentNode.querySelector('b').nextSibling.textContent=' x'+own(a,i,x.dataset.r);
    });
  }});
}

/* gifts */
function gifts(){
  $('#main').innerHTML='<h2>Gifts</h2><p class="sub">Redeem a code from a friend, or manage the codes you created.</p><div class="row"><input id="gc" maxlength="12" placeholder="CODE" aria-label="Gift code"><button class="btn" id="rd">Redeem</button></div><div class="list" id="gl"></div>';
  $('#rd').onclick=redeem;$('#gc').addEventListener('keydown',function(e){if(e.key==='Enter')redeem()});
  api('GET','/api/gifts').then(function(r){
    var l=(r.d.gifts)||[],h='';
    l.forEach(function(g){var a=A(g.a);h+='<div class="li"><img src="'+a.i[g.i]+'" alt=""><div class="t"><b>'+a.c[g.i]+'</b><small>'+a.n+', '+g.r+'</small></div><code>'+g.code+'</code><button class="btn sm ghost" data-c="'+g.code+'">Take back</button></div>'});
    $('#gl').innerHTML=h||'<div class="empty">You have no open gift codes. Create one from a card in your collection.</div>';
    document.querySelectorAll('#gl button').forEach(function(b){b.onclick=function(){api('DELETE','/api/gift/'+b.dataset.c).then(function(x){if(x.ok){ST=x.d.state;toast('Card is back in your collection.');render()}else toast('Could not cancel this code.')})}});
  });
}
function redeem(){
  var c=$('#gc').value.trim();if(!c)return;
  api('POST','/api/redeem',{code:c}).then(function(r){
    if(r.ok){ST=r.d.state;reveal(r.d.card,'A gift for you');render();return}
    toast(r.s===429?'Too many wrong codes. Wait 10 minutes.':r.d.error==='own code'?'You cannot redeem your own code.':'That code is not valid.');
  });
}
boot();
</script>
</body>
</html>
