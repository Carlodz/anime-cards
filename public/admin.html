<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — WAYANIME</title>
<style>
  :root{--bg:#0f1a30;--panel:#17254a;--text:#f2f5fb;--muted:#9fb0d0;--line:#2b3c68;--gold:#f4b82e;--org:#2d6fff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;padding:24px}
  h1{margin:0 0 4px;font-size:1.6rem}
  .sub{color:var(--muted);margin:0 0 20px;font-size:.9rem}
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  th,td{padding:10px 12px;text-align:left;font-size:.88rem;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600;text-transform:uppercase;font-size:.72rem;letter-spacing:.04em}
  tr:last-child td{border-bottom:none}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.72rem;font-weight:700}
  .ver{background:var(--gold);color:#16264a}
  .adm{background:var(--org);color:#fff;margin-inline-start:6px}
  .muted{color:var(--muted)}
  #msg{padding:40px;text-align:center;color:var(--muted)}
  h2{margin:28px 0 10px;font-size:1.1rem}
  .ev{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-height:420px;overflow:auto}
  .ev div{display:flex;gap:10px;align-items:baseline;padding:8px 12px;border-bottom:1px solid var(--line);font-size:.85rem}
  .ev div:last-child{border-bottom:none}
  .ev time{color:var(--muted);font-size:.74rem;white-space:nowrap}
  .tag{font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:999px;background:#2b3c68;white-space:nowrap}
  .t-trade{background:#1f9d55}.t-register{background:var(--org)}.t-pack{background:#8a4fff}.t-login_fail{background:#d64545}.t-gift,.t-send{background:#c98a10}
  .new{animation:fl 2s}@keyframes fl{from{background:#2b4a8a}to{background:transparent}}
  .refresh{float:right;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:6px 14px;border-radius:999px;cursor:pointer;font-size:.8rem}
</style>
</head>
<body>
<h1>Admin — user log <button class="refresh" onclick="load()">Refresh</button></h1>
<p class="sub">Read-only list of every local account (username + password).</p>
<h2>Live activity <span class="muted" id="evinfo" style="font-weight:400;font-size:.8rem"></span></h2>
<div class="ev" id="ev"><div class="muted">Loading…</div></div>
<h2>Accounts</h2>
<div id="msg">Loading…</div>
<table id="tbl" style="display:none">
  <thead><tr><th>User</th><th>Trades</th><th>Cards</th><th>Created</th><th>Last login</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<script>
function fmt(t){ return t ? new Date(t).toLocaleString() : '—'; }
async function load(){
  const msg = document.getElementById('msg'), tbl = document.getElementById('tbl'), rows = document.getElementById('rows');
  msg.style.display = 'block'; tbl.style.display = 'none'; msg.textContent = 'Loading…';
  try{
    const r = await fetch('/api/admin/users', { credentials: 'same-origin' });
    if (r.status === 401) { msg.textContent = 'Connecte-toi d\'abord.'; return; }
    if (r.status === 403) { msg.textContent = 'Ce compte n\'a pas accès à cette page.'; return; }
    if (!r.ok) { msg.textContent = 'Erreur serveur.'; return; }
    const { users } = await r.json();
    rows.innerHTML = users.map(u => `<tr>
      <td>${u.username}${u.verified ? '<span class="badge ver">verified</span>' : ''}${u.admin ? '<span class="badge adm">admin</span>' : ''}</td>
      <td>${u.trades}</td>
      <td>${u.cards}</td>
      <td class="muted">${fmt(u.created)}</td>
      <td class="muted">${fmt(u.lastLogin)}</td>
    </tr>`).join('') || '<tr><td colspan="5" class="muted">No accounts yet.</td></tr>';
    msg.style.display = 'none'; tbl.style.display = 'table';
  }catch(e){ msg.textContent = 'Erreur réseau.'; }
}
load();
let lastT = 0, seen = new Set();
const esc = x => String(x == null ? '' : x).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function loadLog(){
  try{
    const r = await fetch('/api/admin/log', { credentials: 'same-origin' });
    if (!r.ok) return;
    const { events } = await r.json();
    const box = document.getElementById('ev'), first = !seen.size;
    box.innerHTML = events.map(e => {
      const k = e.t + '|' + e.type + '|' + e.text, isNew = !first && !seen.has(k);
      return `<div class="${isNew ? 'new' : ''}"><time>${fmt(e.t)}</time><span class="tag t-${esc(e.type)}">${esc(e.type)}</span><b>${esc(e.u || '—')}</b><span>${esc(e.text)}</span></div>`;
    }).join('') || '<div class="muted">No activity yet.</div>';
    events.forEach(e => seen.add(e.t + '|' + e.type + '|' + e.text));
    document.getElementById('evinfo').textContent = '· auto-refresh 5s';
  }catch(e){}
}
loadLog();
setInterval(() => { loadLog(); load(); }, 5000);
</script>
</body>
</html>
