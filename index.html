<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#100e18"><meta name="description" content="WayAnime - اكتشف عالم الأنمي">
<title>WayAnime — Anime discovery</title><link rel="icon" href="assets/icon.png">
<style>
@font-face{font-family:Noto;src:url('fonts/NotoSans-Regular.ttf')}@font-face{font-family:Noto;src:url('fonts/NotoSans-Bold.ttf');font-weight:700}
:root{--bg:#100e18;--panel:#1b1925;--panel2:#242130;--line:#302c40;--txt:#f7f5ff;--muted:#aaa5bc;--accent:#8b5cf6;--accent2:#c084fc}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 75% -10%,#34205d 0,transparent 38%),var(--bg);color:var(--txt);font-family:'Noto','Noto Kufi Arabic',Tahoma,sans-serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer;color:inherit}.top{height:76px;display:flex;align-items:center;gap:28px;padding:0 5vw;position:sticky;top:0;z-index:20;background:#100e18eF;backdrop-filter:blur(18px);border-bottom:1px solid #ffffff0d}.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:22px;white-space:nowrap}.brand img{width:42px;height:42px;object-fit:contain}.nav{display:flex;gap:20px}.nav button{background:none;border:0;color:var(--muted);font-size:14px}.nav button.active,.nav button:hover{color:white}.search{margin-inline-start:auto;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0 14px;width:min(330px,34vw)}.search input{width:100%;height:42px;background:none;border:0;outline:0;color:white}.search span{color:var(--muted)}.wrap{max-width:1500px;margin:auto;padding:0 5vw 70px}.hero{height:440px;margin:0 -5vw 38px;position:relative;overflow:hidden;background:#1a1524}.hero img{width:100%;height:100%;object-fit:cover;opacity:.66}.hero:after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,var(--bg),transparent 75%),linear-gradient(270deg,#100e18 0%,transparent 85%)}.hero-content{position:absolute;z-index:1;right:8%;bottom:54px;max-width:590px}.eyebrow{color:#d4baff;font-size:13px;letter-spacing:2px}.hero h1{font-size:clamp(36px,5vw,62px);margin:12px 0;line-height:1.15}.hero p{color:#d4d0df;line-height:1.9;max-width:540px}.btn{border:0;border-radius:10px;padding:11px 20px;background:var(--accent);font-weight:700}.btn:hover{background:#7544db}.btn.secondary{background:#ffffff18;border:1px solid #ffffff30}.section-head{display:flex;align-items:center;justify-content:space-between;margin:32px 0 18px}.section-head h2{font-size:21px;margin:0}.section-head small{color:var(--muted)}.filters{display:flex;gap:9px;overflow:auto;padding:4px 0 18px}.chip{white-space:nowrap;border:1px solid var(--line);background:var(--panel);border-radius:30px;padding:8px 15px;color:var(--muted);font-size:13px}.chip.active,.chip:hover{background:var(--accent);border-color:var(--accent);color:#fff}.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:22px 16px}.card{min-width:0;cursor:pointer;position:relative}.poster{position:relative;aspect-ratio:2/2.85;overflow:hidden;border-radius:12px;background:var(--panel2);border:1px solid #ffffff0c}.poster img{width:100%;height:100%;object-fit:cover;transition:transform .3s}.card:hover .poster img{transform:scale(1.06)}.score{position:absolute;top:9px;right:9px;background:#100e18d9;padding:5px 8px;border-radius:7px;font-size:11px}.fav{position:absolute;left:9px;top:9px;width:33px;height:33px;border:0;border-radius:50%;background:#100e18d9;font-size:17px}.fav.on{color:#ff5b91}.card h3{font-size:13px;line-height:1.55;margin:9px 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:11px;color:var(--muted)}.empty{padding:35px;text-align:center;color:var(--muted);grid-column:1/-1}.loading{padding:40px;text-align:center;color:var(--muted)}.modal{position:fixed;inset:0;z-index:50;background:#05040bdc;backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.dialog{width:min(900px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;position:relative}.close{position:absolute;top:14px;left:14px;z-index:2;border:0;border-radius:50%;width:38px;height:38px;background:#08070cbb;font-size:22px}.detail{display:grid;grid-template-columns:240px 1fr;gap:26px;padding:30px}.detail img{width:100%;border-radius:12px}.detail h2{font-size:28px;margin:4px 0 10px}.detail p{color:#c5c0d2;line-height:1.9}.tags{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.tag{background:var(--panel2);border:1px solid var(--line);padding:5px 9px;border-radius:20px;font-size:11px;color:#d4c8ed}.trailer{width:100%;aspect-ratio:16/9;border:0;background:#09070e}.foot{text-align:center;color:#777187;padding:38px 0 0;font-size:12px}.hidden{display:none!important}
@media(max-width:1050px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.nav{gap:12px}}@media(max-width:700px){.top{height:auto;min-height:68px;padding:12px 4vw;gap:12px;flex-wrap:wrap}.brand{font-size:18px}.brand img{width:34px;height:34px}.nav{order:3;width:100%;justify-content:space-between}.search{width:auto;flex:1}.wrap{padding:0 4vw 50px}.hero{height:370px;margin:0 -4vw 28px}.hero-content{right:6%;left:6%;bottom:30px}.hero h1{font-size:36px}.hero p{font-size:13px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 10px}.section-head h2{font-size:18px}.detail{grid-template-columns:110px 1fr;padding:18px;gap:14px}.detail h2{font-size:20px}.detail p{font-size:12px}.detail .btn{padding:8px 12px;font-size:12px}}@media(max-width:390px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head>
<body>
<header class="top"><div class="brand"><img src="assets/logo.png" alt="WayAnime">WayAnime</div><nav class="nav"><button class="active" data-view="home">الرئيسية</button><button data-view="top">الأكثر شعبية</button><button data-view="season">موسم الأنمي</button><button data-view="favorites">المفضلة <span id="favCount"></span></button></nav><label class="search"><span>⌕</span><input id="search" placeholder="ابحث عن أنمي..."></label></header>
<main class="wrap"><section class="hero"><img id="heroImg" src="assets/cards/naruto-7.jpg" alt="Anime cover"><div class="hero-content"><div class="eyebrow">YOUR ANIME UNIVERSE</div><h1>عالم الأنمي<br>بين يديك</h1><p>اكتشف آلاف الأعمال، تابع الأنميات المفضلة لديك، وابحث عن مغامرتك القادمة.</p><button class="btn" id="explore">اكتشف الأنمي ←</button></div></section>
<div class="section-head"><h2 id="heading">أنميات مقترحة لك</h2><small id="resultCount"></small></div><div class="filters" id="filters"><button class="chip active" data-filter="all">الكل</button><button class="chip" data-filter="tv">مسلسلات</button><button class="chip" data-filter="movie">أفلام</button><button class="chip" data-filter="ova">OVA</button></div><section class="grid" id="grid"><div class="loading">جارٍ تحميل عالم الأنمي…</div></section><div style="text-align:center;margin:30px"><button class="btn secondary" id="more">تحميل المزيد</button></div><footer class="foot">WayAnime © 2026 · Made for anime fans</footer></main>
<div class="modal" id="modal"><article class="dialog"><button class="close" id="close">×</button><div id="detail"></div></article></div>
<script>
const API='https://api.jikan.moe/v4';let items=[],page=1,view='home',filter='all',query='',busy=false;const $=s=>document.querySelector(s);const favs=()=>JSON.parse(localStorage.getItem('wayanime:favs')||'[]');const saveFavs=a=>{localStorage.setItem('wayanime:favs',JSON.stringify(a));$('#favCount').textContent=a.length?`(${a.length})`:''};saveFavs(favs());
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function request(path){const r=await fetch(API+path);if(!r.ok)throw Error('API '+r.status);return r.json()}
function render(list){const g=$('#grid');if(!list.length){g.innerHTML='<div class="empty">ما لقينا حتى نتيجة. جرّب بحث آخر.</div>';return}g.innerHTML=list.map(a=>{const id=a.mal_id,im=a.images?.jpg?.large_image_url||a.images?.jpg?.image_url||'assets/icon.png',f=favs().includes(id);return `<article class="card" data-id="${id}"><div class="poster"><img loading="lazy" src="${esc(im)}" alt="${esc(a.title)}"><span class="score">★ ${a.score||'—'}</span><button class="fav ${f?'on':''}" data-fav="${id}" title="المفضلة">♥</button></div><h3>${esc(a.title)}</h3><div class="meta">${esc(a.type||'Anime')} · ${a.year||'—'}</div></article>`}).join('');$('#resultCount').textContent=`${list.length} أنمي`;g.querySelectorAll('.card').forEach(c=>c.onclick=e=>{if(!e.target.closest('[data-fav]'))openAnime(+c.dataset.id)});g.querySelectorAll('[data-fav]').forEach(b=>b.onclick=e=>{e.stopPropagation();let id=+b.dataset.fav,a=favs();a=a.includes(id)?a.filter(x=>x!==id):[...a,id];saveFavs(a);b.classList.toggle('on',a.includes(id))})}
async function load(reset=true){if(busy)return;busy=true;if(reset){page=1;items=[];$('#grid').innerHTML='<div class="loading">جارٍ تحميل الأنميات…</div>'}try{let data;if(view==='favorites'){const ids=favs();let got=await Promise.all(ids.slice((page-1)*12,page*12).map(id=>request('/anime/'+id).then(x=>x.data).catch(()=>null)));data=got.filter(Boolean)}else if(query){data=(await request(`/anime?q=${encodeURIComponent(query)}&limit=24&page=${page}&sfw=true`)).data}else if(view==='top'){data=(await request(`/top/anime?page=${page}&limit=24`)).data}else if(view==='season'){data=(await request(`/seasons/now?page=${page}&limit=24`)).data}else{data=(await request(`/top/anime?filter=bypopularity&page=${page}&limit=24`)).data}items=reset?data:[...items,...data];let shown=items.filter(a=>filter==='all'||(filter==='tv'?a.type==='TV':a.type?.toLowerCase()===filter));render(shown);$('#more').classList.toggle('hidden',view==='favorites'&&items.length>=favs().length)}catch(e){$('#grid').innerHTML=`<div class="empty">تعذّر جلب البيانات. تحقق من اتصال الإنترنت وحاول مجدداً.<br><button class="btn" onclick="load()" style="margin-top:15px">إعادة المحاولة</button></div>`}finally{busy=false}}
async function openAnime(id){$('#modal').classList.add('show');$('#detail').innerHTML='<div class="loading">جارٍ تحميل التفاصيل…</div>';try{const {data:a}=await request('/anime/'+id+'/full');const im=a.images?.jpg?.large_image_url||'';const genres=(a.genres||[]).map(g=>`<span class="tag">${esc(g.name)}</span>`).join('');const trailer=a.trailer?.embed_url;$('#detail').innerHTML=`${trailer?`<iframe class="trailer" src="${esc(trailer)}" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>`:''}<div class="detail"><img src="${esc(im)}" alt=""><div><div class="eyebrow">${esc(a.type||'ANIME')} · ${a.year||'—'}</div><h2>${esc(a.title)}</h2><div class="meta">★ ${a.score||'—'} · ${esc(a.status||'')} · ${a.episodes||'?'} حلقة</div><div class="tags">${genres}</div><p>${esc(a.synopsis||'لا يوجد وصف متاح.')}</p><button class="btn" id="detailFav">${favs().includes(id)?'♥ إزالة من المفضلة':'♡ أضف للمفضلة'}</button>${a.url?` <a class="btn secondary" href="${esc(a.url)}" target="_blank" rel="noopener">صفحة MyAnimeList ↗</a>`:''}</div></div>`;$('#detailFav').onclick=()=>{let x=favs();x=x.includes(id)?x.filter(v=>v!==id):[...x,id];saveFavs(x);$('#detailFav').textContent=x.includes(id)?'♥ إزالة من المفضلة':'♡ أضف للمفضلة';render(items)}}catch(e){$('#detail').innerHTML='<div class="empty">تعذّر تحميل التفاصيل. حاول لاحقاً.</div>'}}
$('#close').onclick=()=>$('#modal').classList.remove('show');$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('show')};$('#explore').onclick=()=>document.querySelector('.section-head').scrollIntoView({behavior:'smooth'});$('#more').onclick=()=>{page++;load(false)};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;query='';$('#search').value='';document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));$('#heading').textContent=({home:'أنميات مقترحة لك',top:'الأكثر شعبية',season:'أنميات هذا الموسم',favorites:'قائمة المفضلة'})[view];load()});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render(items.filter(a=>filter==='all'||(filter==='tv'?a.type==='TV':a.type?.toLowerCase()===filter)))});let timer;$('#search').addEventListener('input',e=>{clearTimeout(timer);timer=setTimeout(()=>{query=e.target.value.trim();view='home';$('#heading').textContent=query?'نتائج البحث':'أنميات مقترحة لك';load()},500)});load();
</script></body></html>
